<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3027">
<title>Solya Reviews | ช่องทางติดตาม</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
    color: white;
    overflow-x: hidden;
    background:
        linear-gradient(135deg, #08251f, #185c49 45%, #071d19);
}

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -2;
    background:
        radial-gradient(circle at 15% 15%, rgba(126,255,190,.25), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(255,230,150,.18), transparent 25%),
        linear-gradient(135deg, #092d25, #1d624f 45%, #061c18);
}

.light {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,245,190,.25), transparent 70%);
    filter: blur(10px);
    animation: floating 9s ease-in-out infinite;
}

.light.one { top: -170px; left: -120px; }
.light.two { right: -160px; bottom: -140px; animation-delay: 3s; }

@keyframes floating {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(30px,-25px); }
}

.leaf {
    position: absolute;
    font-size: 75px;
    opacity: .13;
    animation: leafFloat 8s ease-in-out infinite;
}
.leaf1 { left: 3%; top: 10%; }
.leaf2 { right: 3%; top: 32%; font-size: 100px; animation-delay: 2s; }
.leaf3 { left: 8%; bottom: 5%; font-size: 90px; animation-delay: 4s; }
.leaf4 { right: 13%; bottom: 8%; font-size: 65px; animation-delay: 1s; }

@keyframes leafFloat {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-25px) rotate(8deg); }
}

.wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.card {
    width: 440px;
    max-width: 100%;
    padding: 35px 25px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.23);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 30px 70px rgba(0,0,0,.38);
    animation: cardAppear .8s ease;
}

@keyframes cardAppear {
    from { opacity: 0; transform: translateY(30px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.profile {
    width: 125px;
    height: 125px;
    margin: 0 auto 18px;
    padding: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f5ffd8, #a7e887, #3ca96b);
    box-shadow:
        0 10px 35px rgba(0,0,0,.35),
        0 0 35px rgba(126,255,180,.25);
    animation: profileGlow 3s ease-in-out infinite;
}

.profile img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.9);
}

@keyframes profileGlow {
    0%,100% {
        box-shadow:
            0 10px 35px rgba(0,0,0,.35),
            0 0 25px rgba(126,255,180,.20);
    }
    50% {
        box-shadow:
            0 10px 35px rgba(0,0,0,.35),
            0 0 45px rgba(126,255,180,.45);
    }
}

h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: .3px;
    margin-bottom: 8px;
}

.subtitle {
    color: rgba(255,255,255,.78);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.social {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 65px;
    margin: 13px 0;
    padding: 10px 18px;
    color: white;
    text-decoration: none;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.17);
    background: rgba(255,255,255,.10);
    box-shadow: 0 8px 20px rgba(0,0,0,.16);
    transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
}

.social:hover {
    transform: translateY(-4px) scale(1.015);
    background: rgba(255,255,255,.20);
    box-shadow: 0 15px 30px rgba(0,0,0,.27);
}

.social::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transform: skewX(-20deg);
    transition: left .6s;
}

.social:hover::before { left: 130%; }

.icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    margin-right: 14px;
    font-size: 24px;
    font-weight: bold;
    background: rgba(255,255,255,.16);
}

.name {
    flex: 1;
    text-align: left;
    font-size: 17px;
    font-weight: 600;
}

.username {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: normal;
    opacity: .6;
}

.arrow {
    font-size: 28px;
    opacity: .6;
    transition: transform .25s ease;
}

.social:hover .arrow { transform: translateX(5px); }

.facebook .icon { background: #1877f2; }
.instagram .icon {
    background: linear-gradient(135deg, #feda75, #d62976, #962fbf, #4f5bd5);
}
.tiktok .icon { background: #000; }
.youtube .icon { background: #ff0000; }

.footer {
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.55);
    font-size: 12px;
}

@media(max-width:480px) {
    .wrapper { padding: 20px 12px; }
    .card { padding: 30px 18px 20px; border-radius: 25px; }
    .profile { width: 110px; height: 110px; }
    h1 { font-size: 26px; }
    .subtitle { font-size: 14px; }
    .social { min-height: 61px; padding: 9px 14px; }
    .icon { width: 42px; height: 42px; margin-right: 12px; }
    .name { font-size: 16px; }
}

@media(max-width:350px) {
    .card { padding: 25px 14px 18px; }
    .profile { width: 100px; height: 100px; }
    h1 { font-size: 24px; }
    .social { min-height: 58px; }
}
</style>
</head>
